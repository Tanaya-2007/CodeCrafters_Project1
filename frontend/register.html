<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — SarkariTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="register">
<div class="center"><div class="authcard">
<div class="brand"><span class="mark">S</span><div>SarkariTrack<small>CANDIDATE SPACE</small></div></div>
<h1>Create account</h1><p class="muted">Track applications, countdowns & alerts.</p>
<div class="field"><label>Full name</label><input id="n" placeholder="Aarav Sharma"></div>
<div class="field"><label>Email</label><input id="e" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input id="p" type="password" placeholder="Min 6 characters"></div>
<div class="field"><label>Alert me</label><div class="row"><label class="chip on">7 days before</label><label class="chip on">1 day before</label></div></div>
<button class="btn" style="width:100%" onclick="doReg()">Create account →</button>
<p class="muted">Have an account? <a href="login.html">Candidate login</a> · <a href="admin-login.html">Admin login</a></p>
</div></div>
<script>function doReg(){const e=document.getElementById('e').value.trim(),n=document.getElementById('n').value.trim();if(!e||!n)return alert('Enter name + email');localStorage.setItem('st_user',e);localStorage.setItem('st_name',n);localStorage.setItem('st_role','user');localStorage.removeItem('st_admin');location.href='dashboard.html';}</script>
</body></html>
