<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Details — SarkariTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="explore">
<div class="app"><aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header>
<main class="content"><a href="explore.html">← All exams</a><div class="panel" id="d" style="margin-top:10px"></div></main>
</div></div><div class="modal" id="m"><div class="sheet"><h3 style="margin:0">Update application status</h3>
<p class="muted">Interested → Applied → Admit Card → Exam Done → Completed. Saved to <code>applications</code> in MySQL.</p>
<div class="chiprow" id="opts"></div>
<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost sm" onclick="m.classList.remove('open')">Cancel</button><button class="btn sm" onclick="saveSt()">Save</button></div>
</div></div><div id="toasts"></div>
<script src="js/data.js"></script><script src="js/recommend.js"></script><script src="js/prep.js"></script><script src="js/app.js"></script><script src="js/api.js"></script>
<script>
const order=["Interested","Applied","Admit Card","Exam Done","Completed"];
let eid=null,edata=null,esel="Interested";
function renderDetails(){
  eid=new URLSearchParams(location.search).get("id")||(EXAMS[0]?EXAMS[0].id:"");
  edata=EXAMS.find(x=>String(x.id)===String(eid))||EXAMS[0];
  if(!edata){
    d.innerHTML=`<div class="panel" style="text-align:center;padding:40px"><b>🔍 Exam not found</b><p class="muted">This exam may have been removed or is awaiting admin verification.</p><a class="btn" href="explore.html">← Back to exams</a></div>`;
    return;
  }
  esel=getTracker()[edata.id]||"Interested";
  const e=edata,t=getTracker();const n=daysLeft(e.application_end);const urg=n!==null&&n>=0&&n<=7;
  const hist = Array.isArray(e.history) && e.history.length ? e.history : [{at: (e.last_checked||'').slice(0,10), msg: 'Notice active → status ' + e.status}];
  d.innerHTML=`<div class="row" style="justify-content:space-between"><span class="org">${e.organization}</span>${e.updated?'<span class="badge b-updated">✦ Official update — field changed</span>':statusBadge(e.status)}</div>
<h1 style="margin:8px 0;letter-spacing:-.6px;font-size:clamp(22px,3vw,30px)">${e.title}</h1>
<div class="muted">${e.advt_no||""} · ${e.vacancies??"?"} posts · <a href="${e.official_url}" target="_blank">Official notice ↗</a> (truth) · Last checked ${new Date(e.last_checked||Date.now()).toLocaleString()}</div>
<div class="kpis" style="margin-top:14px"><div class="kpi"><small>📝 Application window</small><b style="font-size:18px">${e.application_start||"?"} → ${e.application_end||"awaited"}</b><span class="tr ${urg?"down":"up"}">${fullCountdown(e)}</span><div class="bar"><i style="width:${urgency(e)}%"></i></div></div>
<div class="kpi"><small>📅 Exam</small><b>${e.exam_date||"TBD"}</b><span class="muted">Admit card: ${e.admit_card_date||"TBD"}</span></div>
<div class="kpi"><small>📌 My status</small><b>${t[e.id]||"Not tracked"}</b><span class="muted">Tap below to update</span></div></div>
<div class="row"><button class="btn" onclick="openM()">${t[e.id]?"Update status ("+t[e.id]+")":"+ Track this exam"}</button><a class="btn ghost" href="${e.official_url}" target="_blank">Open official ↗</a></div>
${matBlock(e)}
<div class="panel" style="background:#f7f8fc;margin-top:14px"><b>📜 Update history (change detection)</b>${hist.map(h=>`<div class="notif"><div class="nicon" style="background:#e4e8ff">◷</div><div><b>${h.at}</b><br><span class="muted">${h.msg}</span></div></div>`).join("")}</div>
<div class="panel" id="roadmapPanel" style="margin-top:14px"></div>`;
}
function openM(){opts.innerHTML=order.map(o=>`<button class="chip ${o===esel?"on":""}" data-s="${o}">${o}</button>`).join("");m.classList.add("open");}
// Study material for ALL exams — not just matched families
function matBlock(e){
  const f=familyForNotice(e);
  const p=getProfile();
  // Generic material for all exams
  const generic = {
    subjects: ["General Knowledge & Current Affairs", "Quantitative Aptitude", "Reasoning Ability", "English Language"],
    books: ["Lucent's General Knowledge", "R.S. Aggarwal — Quantitative Aptitude", "R.S. Aggarwal — Reasoning", "Wren & Martin — English Grammar"],
    links: [{t:"Official notification",u:e.official_url},{t:"Previous year papers",u:e.official_url},{t:"Syllabus PDF",u:e.syllabus_url||e.official_url}]
  };
  const fam = f || {name:e.organization+" Exam",material:generic};
  const why=p?(()=>{const r=recommend(p).find(x=>x.f.id===f.id);return r?`<br>💡 <b>For you:</b> ${r.why}`:'';})():'<br>💡 <a href="profile.html">Set your background</a> to check eligibility';
  return `<div class="panel" style="margin-top:14px"><b>📚 Clear it — ${fam.name} material</b>${why}
  <div class="meta"><b>Subjects:</b> ${fam.material.subjects.join(' · ')}</div>
  <div class="meta"><b>Books:</b><br>• ${fam.material.books.join('<br>• ')}</div>
  <div class="meta"><b>Official links:</b> ${fam.material.links.map(l=>`<a href="${l.u}" target="_blank">${l.t} ↗</a>`).join(' · ')}</div></div>`;
}
opts.onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;esel=b.dataset.s;[...opts.children].forEach(c=>c.classList.toggle("on",c===b));};
function saveSt(){
  const tr=getTracker();
  tr[edata.id]=esel;
  setTracker(tr);
  m.classList.remove("open");
  toast("Status → "+esel);
  renderDetails();
  if(typeof window.apiTrackExam === 'function'){
    window.apiTrackExam(edata.id, esel).catch(e => console.warn('[tracker saveSt]', e.message));
  }
}
async function renderRoadmap(){
  if(!edata) return;
  const panel=document.getElementById('roadmapPanel');
  let map=null, progress={};
  try{
    map=await (await fetch('/api/roadmaps/'+edata.id)).json();
  }catch(_){}
  let userId=null;
  try{
    const owner=await (await fetch('/api/auth/me')).json();
    userId=owner.user&&owner.user.id;
  }catch(_){}
  if(userId){
    try{
      const pd=await (await fetch('/api/roadmaps/'+edata.id+'/progress')).json();
      progress=pd.progress||{};
    }catch(_){}
  }
  if(!map){
    panel.innerHTML='<div class="panel"><b>🗺️ Roadmap</b><span class="muted">No roadmap created yet for this exam.</span></div>';
    return;
  }
  const total=map.weeks.reduce((s,w)=>s+(w.topics||[]).length,0);
  const done=Object.values(progress).filter(Boolean).length;
  const pct=total?Math.round(100*done/total):0;
  panel.innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b>🗺️ Roadmap — ${map.title}</b>${ringHTML(pct)}
    </div>
    <p class="muted">${done}/${total} topics done · <span class="tr">${pct}% complete</span></p>
    ${map.weeks.map(w=>{
      const wDone=(w.topics||[]).filter(t=>progress[t.id]).length;
      const wPct=w.topics.length?Math.round(100*wDone/w.topics.length):0;
      return `<div style="margin-bottom:10px;border-left:3px solid var(--brand);padding-left:8px">
        <div style="display:flex;justify-content:space-between"><b>Week ${w.week_number}</b> · ${w.title}</div>
        <div style="font-size:12px;color:var(--muted);margin:2px 0">${wDone}/${w.topics.length} topics · <span class="tr">${wPct}%</span></div>
        <div class="bar" style="width:100%"><i style="width:${wPct}%"></i></div>
        ${(w.topics||[]).map(t=>`
          <label class="toggle" style="cursor:pointer;display:flex;align-items:center;gap:8px;margin:3px 0">
            <input type="checkbox" ${progress[t.id]?'checked':''} onchange="toggleTopic(${t.id}, this.checked)" style="width:18px;height:18px;accent-color:#111827">
            <span>${t.topic}</span>${t.resource_link?' · <a href="'+t.resource_link+'" target="_blank" style="font-size:11px;color:var(--brand)">resource ↗</a>':''}
          </label>
        `).join('')}
      </div>`;
    }).join('')}
  `;
}
async function toggleTopic(topicId, completed){
  try{
    await fetch('/api/roadmaps/'+edata.id+'/progress',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topicId:Number(topicId), completed:completed===true})
    });
    renderRoadmap();
  }catch(_){toast('Could not save progress — login required');}
}
document.addEventListener("tracker-changed",renderDetails);
document.addEventListener("data-changed",renderDetails);
document.addEventListener("roadmap-changed",renderRoadmap);
renderDetails();
renderRoadmap();
</script>
</body></html>
