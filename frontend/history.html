<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update History — SarkariTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="history">
<div class="app"><aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header>
<main class="content"><h1 style="margin:0">Update history ◷</h1>
<p class="muted">Every field-level change detected by the scheduler: deadline extensions, exam date changes, admit card releases, result announcements. Shown newest first.</p>
<div class="toolbar"><input id="q" placeholder="Filter by exam or text…" style="flex:1"></div>
<div class="panel" id="list"></div></main></div></div><div id="toasts"></div>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/api.js"></script>
<script>
q.oninput=render;
function render(){
  const s=q.value.toLowerCase();
  let rows=[];
  EXAMS.forEach(e=>{
    (e.history||[]).forEach(h=>rows.push({e,h}));
  });
  rows.sort((a,b)=>b.h.at.localeCompare(a.h.at)); // newest first
  if(s)rows=rows.filter(r=>(r.e.title+r.h.msg).toLowerCase().includes(s));
  if(!rows.length){
    list.innerHTML='<p class="muted">No official changes detected yet.</p>';
    return;
  }
  list.innerHTML=rows.map(r=>`<div class="notif"><div class="nicon" style="background:${r.e.updated?"#fef3c7":"#e0e7ff"}">${r.e.updated?"✦":"●"}</div>
  <div style="flex:1"><b>${r.e.title}</b> ${statusBadge(r.e.status)}<br><span class="muted">${r.h.at} — ${r.h.msg}</span></div></div>`).join("");
}
document.addEventListener("data-changed",render);
render();
</script>
</body></html>
