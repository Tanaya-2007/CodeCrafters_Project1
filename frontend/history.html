<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update History — SarkariTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="history">
<div class="app"><aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header>
<main class="content"><h1 style="margin:0">Update history ◷</h1><p class="muted">Every New / Updated event with field diff. Source: <code>exam_updates</code> table.</p>
<div class="toolbar"><input id="q" placeholder="Filter by exam or text…" style="flex:1"></div>
<div class="panel" id="list"></div></main></div></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
q.oninput=render;
function render(){const s=q.value.toLowerCase();let rows=[];
EXAMS.forEach(e=>e.history.forEach(h=>rows.push({e,h})));
rows.sort((a,b)=>b.h.at.localeCompare(a.h.at));
if(s)rows=rows.filter(r=>(r.e.title+r.h.msg).toLowerCase().includes(s));
list.innerHTML=rows.map(r=>`<div class="notif"><div class="nicon" style="background:${r.e.updated?"#fef3c7":"#e0e7ff"}">${r.e.updated?"✦":"●"}</div>
<div style="flex:1"><b>${r.e.title}</b> ${statusBadge(r.e.status)}<br><span class="muted">${r.h.at} — ${r.h.msg}</span><br><a href="${r.e.official_url}" target="_blank" class="muted">Official ↗</a> · <a href="exam-details.html?id=${r.e.id}">Open exam →</a></div></div>`).join("")||"<p>No history.</p>";}
render();
</script>
</body></html>
