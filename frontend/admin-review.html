<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Needs Review — Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="admin-review">
<div class="app"><aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header>
<main class="content"><h1 style="margin:0">Data review ◎</h1><p class="muted">Ambiguous extractions land here — never auto-published. Rules: required fields, end ≥ start, dedup, official URL + retrieval time required.</p>
<div class="grid" id="g"></div></main></div></div><div id="toasts"></div>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/api.js"></script>
<script>
const aheadm=document.createElement('div');aheadm.className='row';aheadm.style.margin='12px 0';
aheadm.innerHTML=`<button class="btn sm" onclick="approveAll()">✓ Approve all New</button><span class="muted">Publishes every pending notice at once (logged).</span>`;
document.querySelector('main').insertBefore(aheadm,document.getElementById('g'));
const AHEAD=()=>({Authorization:'Bearer '+(localStorage.getItem('st_token')||'')});
async function loadQueue(){
  try{
    const r=await fetch('/api/review',{headers:AHEAD()});
    if(!r.ok)throw 0;const live=await r.json();
    if(Array.isArray(live)){EXAMS.length=0;live.forEach(e=>EXAMS.push(e));}
  }catch(_){/* offline demo: local EXAMS */}
  render();
}
function render(){
const q=EXAMS.filter(e=>e.status==="New"||e.status==="Needs Review");
g.innerHTML=q.map(e=>`<div class="card"><div class="org">${e.organization}</div><h3>${e.title}</h3><div style="align-self:flex-start;margin-top:8px">${statusBadge(e.status)}</div>
<div class="meta">❌ Missing: <b>${[!e.application_end&&"application_end",!e.exam_date&&"exam_date"].filter(Boolean).join(", ")}</b><br>🔗 <a href="${e.official_url}" target="_blank">Official ↗</a><br><span class="muted">Retrieved ${new Date(e.last_checked).toLocaleString()}</span></div>
<div class="row" style="margin-top:14px"><button class="btn sm" onclick="decide('${e.id}','approve')">✓ Approve</button><button class="btn sm ghost" onclick="toast('Sent back to parser queue')">↺ Re-parse</button><button class="btn sm ghost" onclick="decide('${e.id}','reject')">Reject</button></div></div>`).join("")||"<p>Queue empty. 🎉</p>";
}
async function decide(id,how){
  try{
    const r=await fetch('/api/admin/exams/'+id+'/'+how,{method:'POST',headers:AHEAD()});
    if(!r.ok)throw 0;
    const i=EXAMS.findIndex(e=>e.id===id);if(i>=0)EXAMS.splice(i,1);
    toast(how==='approve'?'✓ Published':'Rejected — hidden');render();return;
  }catch(_){/* offline demo */}
  const i=EXAMS.findIndex(e=>e.id===id);
  if(i>=0){if(how==='approve'){EXAMS[i].status='Verified';}else{EXAMS.splice(i,1);}toast(how==='approve'?'✓ Published (demo)':'Rejected (demo)');render();}
}
async function approveAll(){
  try{
    const r=await fetch('/api/admin/exams/approve-all',{method:'POST',headers:AHEAD()});
    if(!r.ok)throw 0;const j=await r.json();toast('✓ Published '+j.approved+' notices');loadQueue();return;
  }catch(_){toast('Backend offline — approve items one by one');}
}
document.addEventListener("data-changed",render);loadQueue();
</script>
</body></html>
